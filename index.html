<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yomikana</title>
<meta name="description" content="Learn to read the Japanese kana with adaptive spaced repetition. Works offline.">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafaf8">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#2b2b2b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/home.css">
<link rel="stylesheet" href="css/session.css">
<link rel="stylesheet" href="css/reading.css">
</head>
<body>

<main id="home" class="view">
  <div class="topbar">
    <div class="brand">
      <div class="brand-seal kana-font" id="brandSeal" aria-hidden="true">あ</div>
      <h1>Yomikana<small>learn to read the kana</small></h1>
    </div>
    <div class="toggles">
      <button id="soundBtn" class="icon-btn" aria-label="Toggle sound">
        <svg class="main" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
        <svg class="alt" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="15" y1="9" x2="21" y2="15"/><line x1="21" y1="9" x2="15" y2="15"/></svg>
      </button>
      <button id="themeBtn" class="icon-btn" aria-label="Toggle theme">
        <svg class="main" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
        <svg class="alt" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="4.2" y1="4.2" x2="5.6" y2="5.6"/><line x1="18.4" y1="18.4" x2="19.8" y2="19.8"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/><line x1="4.2" y1="19.8" x2="5.6" y2="18.4"/><line x1="18.4" y1="5.6" x2="19.8" y2="4.2"/></svg>
      </button>
    </div>
  </div>
  <div class="switch-row">
    <div class="script-switch" role="tablist" aria-label="What to drill">
      <button role="tab" data-script="hira" aria-selected="true">Hiragana</button>
      <button role="tab" data-script="kata" aria-selected="false">Katakana</button>
      <button role="tab" data-script="mix" aria-selected="false" aria-label="Hiragana against katakana">Both</button>
    </div>
    <!-- filled in from the mode on the left: which pair of directions these two
         stand for depends on it, so they are labeled in home.js rather than here -->
    <div class="script-switch dir-switch" role="tablist" aria-label="Question direction">
      <button role="tab"></button>
      <button role="tab"></button>
    </div>
  </div>
  <button id="refreshCard" class="home-card refresh-card hidden">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>
    <span class="card-title">Refresh<span class="card-count mono"></span></span>
    <span class="card-sub"></span>
    <span class="refresh-bar"><i></i></span>
  </button>
  <button id="readCard" class="home-card read-card hidden">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4.5h6a3 3 0 0 1 3 3V20a2.5 2.5 0 0 0-2.5-2.5H2z"/><path d="M22 4.5h-6a3 3 0 0 0-3 3V20a2.5 2.5 0 0 1 2.5-2.5H22z"/></svg>
    <span class="card-title">Reading<span class="card-count mono"></span></span>
    <span class="card-sub"></span>
  </button>
  <ul id="groupList" class="groups"></ul>
  <div class="home-foot">
    <div class="reset-zone">
      <button id="resetBtn" class="link-btn">Reset progress</button>
      <div id="resetConfirm" class="reset-confirm hidden">
        <span>Erase all progress?</span>
        <button id="resetYes" class="link-btn danger">Erase</button>
        <button id="resetNo" class="link-btn">Cancel</button>
      </div>
      <p id="resetDone" class="reset-done hidden" role="status">Progress erased.</p>
    </div>
    <div id="appVersion" class="app-version" aria-hidden="true"></div>
  </div>
</main>

<main id="session" class="view hidden">
  <div class="session-bar">
    <button id="backBtn" class="icon-btn" aria-label="Back to lessons">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="session-title" id="sessionTitle"></div>
  </div>
  <div class="stage" id="stage"></div>
  <div id="sessionFoot" class="session-foot">
    <button id="pauseBtn" class="link-btn">Resume later</button>
    <p id="audioNote" class="audio-note" role="status"></p>
  </div>
</main>

<!-- Registering the worker is the one thing that cannot wait for the app. It is
     the road every later build arrives by, so hanging it off the module graph
     makes the one build that cannot boot also the one nothing can upgrade away
     from — which is exactly how a page that threw on load once sat there dead
     while a fix for it was already published. Plain script, no imports, so it
     runs whatever the modules below do. -->
<script>
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.addEventListener("message", function (e) {
    if (!e.data || e.data.type !== "upgraded") return;
    // the app picks a moment the reload costs nothing — never mid-round, where
    // it reads as quitting on its own. It is given until it has had its chance
    // to boot to say so; if it never got that far there is no session to lose
    // and nobody to ask.
    var take = function () {
      if (window.takeUpgrade) window.takeUpgrade();
      else location.reload();
    };
    if (document.readyState === "complete") take();
    else addEventListener("load", take);
  });
  // addEventListener alone leaves the messages queued: delivery starts on an
  // onmessage assignment or on this call, and without it the worker is talking
  // to nobody
  navigator.serviceWorker.startMessages();
  navigator.serviceWorker.register("sw.js").catch(function () { /* offline still works next load */ });
}
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>

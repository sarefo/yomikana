<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yomikana</title>
<meta name="description" content="Learn to read the Japanese kana with adaptive spaced repetition. Works offline.">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafaf8">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#131317">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root {
  --bg: #fafaf8;
  --surface: #ffffff;
  --ink: #17171c;
  --muted: #70707a;
  --border: #e7e6e1;
  --border-strong: #d8d7d1;
  --seal: #d6402f;
  --seal-ink: #ffffff;
  --indigo: #4361b2;
  --indigo-soft: #e4e9f6;
  --good: #2f9e63;
  --good-soft: #e2f3ea;
  --bad-soft: #fbe9e6;
  --warn: #d99a26;
  --track: #dedcd6;
  --shadow: 0 1px 2px rgba(23,23,28,.04), 0 8px 24px rgba(23,23,28,.06);
  --shadow-lift: 0 2px 4px rgba(23,23,28,.05), 0 12px 32px rgba(23,23,28,.10);
}
[data-theme="dark"] {
  --bg: #131317;
  --surface: #1d1d23;
  --ink: #ededef;
  --muted: #97979f;
  --border: #2b2b33;
  --border-strong: #3a3a44;
  --seal: #f26b5b;
  --seal-ink: #1a0d0b;
  --indigo: #8fa7e8;
  --indigo-soft: #262c3e;
  --good: #53c98a;
  --good-soft: #1c3128;
  --bad-soft: #3a221f;
  --warn: #d9a441;
  --track: #33333d;
  --shadow: none;
  --shadow-lift: none;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  line-height: 1.5;
  min-height: 100dvh;
  -webkit-tap-highlight-color: transparent;
}
.kana-font {
  font-family: "Hiragino Sans", "Yu Gothic UI", "Meiryo", "Noto Sans JP", system-ui, sans-serif;
}
.mono {
  font-family: ui-monospace, "Cascadia Code", "SF Mono", Consolas, monospace;
}
button {
  font: inherit;
  color: inherit;
  background: none;
  border: none;
  cursor: pointer;
}
button:focus-visible, a:focus-visible {
  outline: 2px solid var(--indigo);
  outline-offset: 2px;
  border-radius: 8px;
}
.view { max-width: 30rem; margin: 0 auto; padding: 1rem .75rem 3rem; }
.hidden { display: none !important; }

/* ---------- home ---------- */
#home { display: flex; flex-direction: column; min-height: 100dvh; padding-bottom: 1rem; }
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: .5rem 0 .875rem;
}
.brand { display: flex; align-items: center; gap: .75rem; }
.brand-seal {
  width: 2.5rem;
  height: 2.5rem;
  border-radius: .625rem;
  background: var(--seal);
  color: var(--seal-ink);
  display: grid;
  place-items: center;
  font-size: 1.35rem;
  line-height: 1;
  transform: rotate(-4deg);
  flex: none;
}
.brand h1 { font-size: 1.3rem; font-weight: 700; letter-spacing: -.01em; }
.brand small { display: block; font-size: .75rem; font-weight: 400; color: var(--muted); letter-spacing: .04em; }
.toggles { display: flex; gap: .25rem; }
.icon-btn {
  width: 3rem;
  height: 3rem;
  border-radius: .75rem;
  display: grid;
  place-items: center;
  color: var(--muted);
  transition: background .15s, color .15s;
}
.icon-btn:hover { background: var(--surface); color: var(--ink); }
.icon-btn svg { width: 1.25rem; height: 1.25rem; }
.icon-btn .alt { display: none; }
[data-sound="off"] #soundBtn .main { display: none; }
[data-sound="off"] #soundBtn .alt { display: block; }
[data-theme="dark"] #themeBtn .main { display: none; }
[data-theme="dark"] #themeBtn .alt { display: block; }

/* the two scripts are one choice, so they share one pill rather than sitting
   as two separate tabs above the deck */
.script-switch {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: .25rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: .875rem;
  padding: .25rem;
  margin-bottom: .75rem;
  box-shadow: var(--shadow);
}
.script-switch button {
  min-height: 2.5rem;
  border-radius: .625rem;
  display: flex;
  align-items: baseline;
  justify-content: center;
  gap: .4rem;
  color: var(--muted);
  font-size: .78rem;
  font-weight: 600;
  letter-spacing: .04em;
  transition: background .15s, color .15s;
}
.script-switch .native { font-size: 1rem; font-weight: 500; letter-spacing: .02em; }
.script-switch button[aria-selected="true"] { background: var(--ink); color: var(--bg); }

/* Four rows of two, sized off the viewport so the whole deck lands on one
   screen: a small phone loses tile height, never a row. The 17rem is
   everything the grid is not — the view's padding, the topbar, the script
   switch, the reset strip and the three gaps between the rows. */
/* The way back into everything already learned. It sits above the deck rather
   than in it because what has gone stale is spread across the groups, not
   parked in any one of them; it stays hidden until there is something to
   refresh, so a first run still shows the eight tiles and nothing else. */
.refresh-card {
  width: 100%;
  display: grid;
  grid-template-columns: auto 1fr;
  align-items: center;
  gap: .1rem .625rem;
  text-align: left;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 1rem;
  padding: .55rem .75rem;
  margin-bottom: .625rem;
  box-shadow: var(--shadow);
  transition: transform .15s, box-shadow .15s, border-color .15s;
}
.refresh-card:hover { transform: translateY(-1px); box-shadow: var(--shadow-lift); border-color: var(--border-strong); }
.refresh-card:active { transform: translateY(0); }
.refresh-card > svg { width: 1.15rem; height: 1.15rem; grid-row: span 2; color: var(--indigo); }
.refresh-card.rusty > svg { color: var(--warn); }
.refresh-title { display: flex; align-items: baseline; gap: .4rem; font-weight: 650; font-size: .88rem; }
.refresh-count { font-size: .72rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.refresh-count b { color: var(--indigo); font-weight: 650; }
.refresh-sub { font-size: .72rem; color: var(--muted); }
.refresh-bar { grid-column: 1 / -1; height: .25rem; margin-top: .4rem; border-radius: 999px; background: var(--indigo-soft); overflow: hidden; }
.refresh-bar > i { display: block; height: 100%; background: var(--indigo); border-radius: 999px; transition: width .3s; }

.groups {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: .625rem;
  grid-auto-rows: clamp(3.5rem, calc((100dvh - 17rem) / 4), 7.5rem);
  list-style: none;
}
/* with the refresh strip showing, the rows give up its height and the gap
   under it -- measured at 5.07rem together -- so the deck still lands on one
   screen. The floor drops a little too: on a short phone the strip is worth
   more than the last quarter-rem of tile height. */
#home.has-refresh .groups { grid-auto-rows: clamp(3.25rem, calc((100dvh - 22rem) / 4), 7.5rem); }
.group-card {
  width: 100%;
  height: 100%;
  text-align: left;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 1rem;
  padding: .5rem .625rem;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  gap: .25rem;
  overflow: hidden;
  container-type: size;
  transition: transform .15s, box-shadow .15s, border-color .15s;
}
.group-card:hover { transform: translateY(-1px); box-shadow: var(--shadow-lift); border-color: var(--border-strong); }
.group-card:active { transform: translateY(0); }
/* one character of the group, sunk into the tile: it names the script at a
   glance without turning the tile back into a character list, and it fills
   the middle of the tile that the two lines of text leave empty */
.group-mark {
  flex: 1;
  min-height: 0;
  display: grid;
  place-items: center;
  font-size: 2.25rem;
  line-height: 1;
  color: var(--ink);
  opacity: .13;
  pointer-events: none;
}
.group-mark.two { font-size: 1.4rem; }
/* sized off the tile rather than the root, so it shrinks with the rows on a
   short screen instead of overrunning them */
@supports (font-size: 1cqh) {
  .group-mark { font-size: 44cqh; }
  .group-mark.two { font-size: 27cqh; }
}
.group-top { display: flex; align-items: baseline; justify-content: space-between; gap: .5rem; }
.group-index { font-size: .7rem; color: var(--muted); }
.group-count { font-size: .72rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.group-count b { color: var(--indigo); font-weight: 650; }
.group-card.full .group-count, .group-card.full .group-count b { color: var(--good); }
.group-name { font-weight: 650; font-size: .88rem; line-height: 1.2; }
.group-bar { height: .25rem; border-radius: 999px; background: var(--indigo-soft); overflow: hidden; }
.group-bar > i { display: block; height: 100%; background: var(--indigo); border-radius: 999px; transition: width .3s; }
.group-card.full .group-bar > i { background: var(--good); }
.home-foot { margin-top: auto; padding-top: .75rem; font-size: .8rem; color: var(--muted); text-align: center; }
/* one fixed-height slot holds the button, the confirmation and the receipt in
   turn, so swapping between them never shifts the page under a thumb */
.reset-zone { margin-top: .75rem; min-height: 2.75rem; display: grid; place-items: center; }
.link-btn {
  min-height: 2.75rem;
  padding: 0 .75rem;
  font-size: .8rem;
  color: var(--muted);
  border-radius: .5rem;
  text-decoration: underline;
  text-underline-offset: .2em;
}
.link-btn:hover { color: var(--ink); background: var(--surface); }
.link-btn.danger { color: var(--seal); font-weight: 650; }
.reset-confirm { display: flex; align-items: center; justify-content: center; gap: .125rem; flex-wrap: wrap; }
.reset-done { color: var(--good); font-weight: 650; }

/* ---------- session ---------- */
.session-bar {
  display: flex;
  align-items: center;
  gap: .5rem;
  padding: .5rem 0 .25rem;
}
.session-bar .icon-btn { margin-left: -.75rem; }
.session-title { font-weight: 650; font-size: 1rem; flex: 1; }

.stage {
  margin-top: 1.25rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 1.25rem;
  box-shadow: var(--shadow);
  padding: 1rem .75rem;
  min-height: 22rem;
  display: flex;
  flex-direction: column;
}
.prompt-zone {
  flex: 1;
  display: grid;
  place-items: center;
  position: relative;
  padding: .25rem 0 1rem;
}
.kana-big {
  font-size: clamp(5.5rem, 28vw, 8rem);
  line-height: 1.1;
  font-weight: 500;
  animation: kanaIn .2s ease-out;
}
@keyframes kanaIn { from { opacity: 0; transform: scale(.96); } }

/* the reading is the prompt; the kana are the four answers */
.prompt {
  display: grid;
  gap: .4rem;
  place-items: center;
  padding: .75rem 1.75rem;
  border-radius: 1rem;
  transition: background .15s;
}
.prompt:hover { background: var(--bg); }
.romaji-big {
  font-size: clamp(3.25rem, 17vw, 4.5rem);
  line-height: 1.1;
  font-weight: 500;
  letter-spacing: .06em;
  animation: kanaIn .2s ease-out;
}
.prompt-hint {
  font-size: .68rem;
  color: var(--muted);
  letter-spacing: .1em;
  text-transform: uppercase;
}
[data-sound="off"] .prompt-hint { visibility: hidden; }

.answers {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: .625rem;
  container-type: inline-size;
  position: relative;
}
/* the original's cake diagram: gray is what's left, amber the progress made,
   green the share of that progress earned without a miss */
.pie {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 2.5rem;
  height: 2.5rem;
  margin: -1.25rem 0 0 -1.25rem;
  border-radius: 50%;
  pointer-events: none;
  box-shadow: 0 0 0 1px var(--border), 0 0 0 .3rem var(--surface);
  background: conic-gradient(
    var(--good) 0 var(--clean),
    var(--warn) var(--clean) var(--done),
    var(--track) var(--done) 100%
  );
}
.answer {
  /* width comes from the grid track; the ratio sets height from it, and on a
     short screen the tiles lose height rather than the grid losing a row */
  width: 100%;
  aspect-ratio: 1 / 1.1;
  max-height: calc((100dvh - 21rem) / 2);
  min-height: 4.5rem;
  display: grid;
  place-items: center;
  border-radius: 1.125rem;
  border: 1px solid var(--border-strong);
  background: var(--bg);
  line-height: 1;
  font-size: clamp(3rem, 21vw, 7rem);
  transition: background .15s, border-color .15s, color .15s, transform .1s;
  position: relative;
}
.answer.two { font-size: clamp(2rem, 13vw, 4.5rem); }
/* scale the kana against the answer grid itself rather than the viewport,
   so the tiles stay right once the 30rem container stops growing */
@supports (font-size: 1cqw) {
  .answer { font-size: 28cqw; }
  .answer.two { font-size: 17cqw; }
}
.answer:hover:not(:disabled) { border-color: var(--indigo); }
.answer:active:not(:disabled) { transform: scale(.98); }
.answer .key {
  position: absolute;
  top: .3rem;
  left: .5rem;
  font-size: .65rem;
  color: var(--muted);
  letter-spacing: 0;
}
@media (hover: none) and (pointer: coarse) {
  .answer .key { display: none; }
}
.answer.correct { background: var(--good-soft); border-color: var(--good); color: var(--good); }
.answer.wrong { background: var(--bad-soft); border-color: var(--seal); color: var(--seal); animation: shake .3s; }
.answer:disabled { cursor: default; }
@keyframes shake {
  25% { transform: translateX(-4px); }
  50% { transform: translateX(4px); }
  75% { transform: translateX(-2px); }
}

@keyframes stageIn { from { opacity: 0; transform: translateY(8px); } }

/* a character's first appearance: marked in place, no separate screen */
.answer.new {
  border-color: var(--indigo);
  background: var(--indigo-soft);
  color: var(--indigo);
  animation: newTile .3s ease-out;
}
@keyframes newTile { from { transform: scale(.94); } }
.primary-btn {
  min-height: 3.25rem;
  border-radius: .875rem;
  background: var(--ink);
  color: var(--bg);
  font-weight: 600;
  font-size: 1rem;
  transition: opacity .15s, transform .1s;
}
.primary-btn:hover { opacity: .9; }
.primary-btn:active { transform: scale(.98); }
.ghost-btn {
  min-height: 3.25rem;
  border-radius: .875rem;
  border: 1px solid var(--border-strong);
  font-weight: 600;
  font-size: 1rem;
}
.ghost-btn:hover { border-color: var(--indigo); }

/* mastered */
.mastered { text-align: center; flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 1rem; animation: stageIn .25s ease-out; }
.mastered .kana-big { font-size: 4rem; }
.mastered h2 { font-size: 1.3rem; }
.mastered p { color: var(--muted); font-size: .9rem; }
.mastered-actions { display: grid; gap: .625rem; margin-top: .5rem; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<main id="home" class="view">
  <div class="topbar">
    <div class="brand">
      <div class="brand-seal kana-font" id="brandSeal" aria-hidden="true">あ</div>
      <h1>Yomikana<small>learn to read the kana</small></h1>
    </div>
    <div class="toggles">
      <button id="soundBtn" class="icon-btn" aria-label="Toggle sound">
        <svg class="main" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
        <svg class="alt" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="15" y1="9" x2="21" y2="15"/><line x1="21" y1="9" x2="15" y2="15"/></svg>
      </button>
      <button id="themeBtn" class="icon-btn" aria-label="Toggle theme">
        <svg class="main" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
        <svg class="alt" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="4.2" y1="4.2" x2="5.6" y2="5.6"/><line x1="18.4" y1="18.4" x2="19.8" y2="19.8"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/><line x1="4.2" y1="19.8" x2="5.6" y2="18.4"/><line x1="18.4" y1="5.6" x2="19.8" y2="4.2"/></svg>
      </button>
    </div>
  </div>
  <div class="script-switch" role="tablist" aria-label="Script">
    <button role="tab" data-script="hira" aria-selected="true"><span class="native kana-font">ひらがな</span>Hiragana</button>
    <button role="tab" data-script="kata" aria-selected="false"><span class="native kana-font">カタカナ</span>Katakana</button>
  </div>
  <button id="refreshCard" class="refresh-card hidden">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>
    <span class="refresh-title">Refresh<span class="refresh-count mono"></span></span>
    <span class="refresh-sub"></span>
    <span class="refresh-bar"><i></i></span>
  </button>
  <ul id="groupList" class="groups"></ul>
  <div class="home-foot">
    <div class="reset-zone">
      <button id="resetBtn" class="link-btn">Reset progress</button>
      <div id="resetConfirm" class="reset-confirm hidden">
        <span>Erase both scripts?</span>
        <button id="resetYes" class="link-btn danger">Erase</button>
        <button id="resetNo" class="link-btn">Cancel</button>
      </div>
      <p id="resetDone" class="reset-done hidden" role="status">Progress erased.</p>
    </div>
  </div>
</main>

<main id="session" class="view hidden">
  <div class="session-bar">
    <button id="backBtn" class="icon-btn" aria-label="Back to lessons">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="session-title" id="sessionTitle"></div>
  </div>
  <div class="stage" id="stage"></div>
</main>

<script>

// and free of kana so one set of titles serves both scripts
// which character stands for each group on its tile: the one that says most
// about what is inside, not just whichever happens to be first
const MARK_AT = [0, 5, 0, 10, 15, 0, 0, 0];
const DISPLAY = [
  "Vowels · K · S",
  "T · N · H",
  "M · Y · R · W",
  "Voiced G · D",
  "Voiced Z · B · P",

// Katakana sits one block above hiragana, so every deck but one converts
// character for character and stays in step with its hiragana twin.
function toKatakana(str) {
  return str.replace(/[ぁ-ゖ]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60));
}
// the exception: which characters are easy to confuse is a fact about the
// shapes, not about the sounds, so katakana needs its own look-alike set
const KATAKANA_SIMILAR = [
  { k: "ツ", r: "tsu" }, { k: "シ", r: "shi" }, { k: "ソ", r: "so" }, { k: "ン", r: "n" },
  { k: "ノ", r: "no" }, { k: "メ", r: "me" }, { k: "ヌ", r: "nu" }, { k: "ス", r: "su" },
  { k: "ク", r: "ku" }, { k: "タ", r: "ta" }, { k: "ワ", r: "wa" }, { k: "ウ", r: "u" },
  { k: "フ", r: "fu" }, { k: "ヲ", r: "wo" }, { k: "コ", r: "ko" }, { k: "ユ", r: "yu" },
  { k: "エ", r: "e" }, { k: "ア", r: "a" }, { k: "マ", r: "ma" }, { k: "ム", r: "mu" },
];
const KATAKANA = HIRAGANA.map(g => ({
  name: g.name,
  cards: g.name === "similar" ? KATAKANA_SIMILAR
       : g.cards.map(c => ({ k: toKatakana(c.k), r: c.r })),
}));
const SCRIPTS = {
  hira: { groups: HIRAGANA, seal: "あ" },
  kata: { groups: KATAKANA, seal: "ア" },
};

// Spaced-repetition constants, ported from the original app:
// a card at level L waits nextByLevel[L] questions before it is due again.
const NEXT_BY_LEVEL = [0, 1, 5, 10, 20];
const MAX_LEVEL = NEXT_BY_LEVEL.length; // levels run 0..4

// A tile counts what has been learned; the refresh strip counts what is still
// sharp. They need different thresholds, because decay costs the top level
// first: with one bar doing both jobs, six weeks away turns a deck the learner
// still knows perfectly well into 0/15 and reads as erased rather than rusty.
const LEARNED_AT = MAX_LEVEL - 2;

// How long a new character has to wait its turn. All three have to be clear
// before one is introduced: every character already on the table answered right
// at least NEW_AFTER_LEVEL times, no more than WORKING_SET of them still short
// of the top level, and at least NEW_COOLDOWN questions since the last
// newcomer. Left ungated the deck fills up about twice as fast as it is
// learned — you end up juggling seven half-known characters instead of four.
const NEW_AFTER_LEVEL = 3;
const WORKING_SET = 4;
const NEW_COOLDOWN = 6;

// Levels also fade with wall-clock time, not only with questions asked. The
// waits above are counted in questions, so they stop the moment the tab is
// closed: without this a deck left alone for two months still reads as
// mastered and offers nothing to do. DECAY_DAYS[L] is how long a card sitting
// at level L survives untouched before it slips a level; level 0 has nothing
// left to lose, and an introduced card never falls past DECAY_FLOOR, because
// coming back after a long absence should schedule a refresh rather than read
// as erased progress.
//
// The lower windows are wide on purpose. These are not estimates of when a
// character is forgotten; they are how fast the app is willing to walk you
// back down. Tight ones cascade: 30/10/5 sends a mastered card to the floor
// after seven weeks away, and the deck you left full reads as untouched. At
// 30/21/14 a six-week absence costs two levels and it takes better than two
// months to lose the lot, which is about when that is honestly true.
const DECAY_DAYS = [0, 0, 14, 21, 30];
const DECAY_FLOOR = 1;

// Characters that get missed a lot earn shorter waits and faster decay: a
// character you keep getting wrong is not the one that survives a fortnight
// untouched. The cap keeps one terrible afternoon from pinning a card at the
// bottom for good.
const MISS_CAP = 6;
const MISS_WEIGHT = 0.25;

function today() { return Math.floor(Date.now() / 864e5); }
// 1 for a card never missed, up to 2.5 for the worst of them. It divides the
// waits and the decay windows, and weights the draw among mastered cards.
function leech(card) { return 1 + Math.min(card[4] || 0, MISS_CAP) * MISS_WEIGHT; }

// Walk a card down however many levels its time away has cost it. The days
// each drop consumes are taken off the clock rather than discarded, so a
// return after ten weeks lands where it should instead of costing one level.
function decayCard(c, now) {
  let elapsed = now - c[3];
  if (elapsed <= 0) return false;
  const f = leech(c);
  let dropped = false;
  while (c[0] > DECAY_FLOOR && DECAY_DAYS[c[0]]) {
    const window = Math.max(1, Math.round(DECAY_DAYS[c[0]] / f));
    if (elapsed < window) break;
    elapsed -= window;
    c[0]--;
    c[1] = 0;            // a faded card is due at once
    dropped = true;
  }
  if (dropped) c[3] = now - elapsed;
  return dropped;
}

const STORE_KEY = "yomikana-v1";
const LEGACY_KEY = "hiragana-v1";  // the pre-rename store, no longer read

/* ---------- persistence ---------- */
function loadStore() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE_KEY));
    if (s && s.groups) { s.fails = s.fails || {}; return s; }
  } catch (e) { /* corrupted or unavailable storage: start fresh */ }
  return { groups: {}, settings: {}, fails: {} };
}
// the rename to Yomikana started the store over; don't leave the old one behind
try { localStorage.removeItem(LEGACY_KEY); } catch (e) { /* nothing to clean */ }
const store = loadStore();
// decks saved before katakana existed are keyed by bare group name, and every
// one of them is a hiragana deck
for (const bag of [store.groups, store.fails]) {
  for (const k of Object.keys(bag)) {
    if (k.indexOf(":") === -1) { bag["hira:" + k] = bag[k]; delete bag[k]; }
  }
}
let script = store.settings.script === "kata" ? "kata" : "hira";
let GROUPS = SCRIPTS[script].groups;
function groupKey(gi) { return script + ":" + GROUPS[gi].name; }
function saveStore() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) { /* private mode etc. */ }
}
// [level, next, introduced, lastDay, misses]
function groupState(gi) {
  const key = groupKey(gi);
  const now = today();
  let arr = store.groups[key];
  if (!arr || arr.length !== GROUPS[gi].cards.length) {
    arr = GROUPS[gi].cards.map(() => [0, 0, 0, now, 0]);
    store.groups[key] = arr;
  }
  let dirty = false;
  for (let i = 0; i < arr.length; i++) {
    const c = arr[i];
    // decks saved before the introduced flag existed: anything above level 0
    // has plainly been seen, so it should not be re-announced as new
    if (c.length < 3) c[2] = c[0] > 0 ? 1 : 0;
    // decks saved before decay: start their clock today rather than at the
    // epoch, so installing this version does not fade anybody's progress
    if (c.length < 4) { c[3] = now; dirty = true; }
    if (c.length < 5) { c[4] = 0; dirty = true; }
    if (c[2] && decayCard(c, now)) dirty = true;
  }
  if (dirty) saveStore();
  return arr;
}

/* ---------- audio ---------- */
let jaVoice = null;
function pickVoice() {
  const voices = speechSynthesis.getVoices();
  jaVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith("ja")) || null;
}
if ("speechSynthesis" in window) {
  pickVoice();
  speechSynthesis.addEventListener("voiceschanged", pickVoice);
}
function speak(kana) {
  if (store.settings.sound === false || !("speechSynthesis" in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(kana);
    // a ja voice if one is installed, otherwise let the platform choose by language
    if (jaVoice) u.voice = jaVoice;
    u.lang = jaVoice ? jaVoice.lang : "ja-JP";
    u.rate = 0.85;
    speechSynthesis.speak(u);
  } catch (e) { /* audio is optional */ }
}

/* ---------- home ---------- */
const homeEl = document.getElementById("home");
const sessionEl = document.getElementById("session");
const groupListEl = document.getElementById("groupList");
const refreshEl = document.getElementById("refreshCard");

// Everything introduced in the current script, one entry per character. Some
// characters sit in more than one group -- た is in three, and the look-alike
// deck borrows from everywhere -- so without folding them together a mixed
// question could offer the same kana on two buttons.
function reviewDeck() {
  const byKana = new Map();
  GROUPS.forEach((g, gi) => {
    const st = groupState(gi);
    const key = groupKey(gi);
    g.cards.forEach((card, ci) => {
      if (!st[ci][2]) return;
      let e = byKana.get(card.k);
      if (!e) { e = { k: card.k, r: card.r, refs: [], keys: [] }; byKana.set(card.k, e); }
      e.refs.push(st[ci]);
      e.keys.push(key);
    });
  });
  // weakest copy first: a refresh should meet the character in the group where
  // it is shakiest, and the answer is written back to all of them either way
  for (const e of byKana.values()) {
    e.refs.sort((a, b) => (a[0] - b[0]) || ((b[4] || 0) - (a[4] || 0)));
  }
  return [...byKana.values()];
}

function renderRefresh() {
  const deck = reviewDeck();
  const total = deck.length;
  homeEl.classList.toggle("has-refresh", total > 0);
  refreshEl.classList.toggle("hidden", total === 0);
  if (!total) return;
  let rusty = 0;
  for (const e of deck) if (e.refs[0][0] < MAX_LEVEL - 1) rusty++;
  const solid = total - rusty;
  refreshEl.classList.toggle("rusty", rusty > 0);
  refreshEl.querySelector(".refresh-count").innerHTML = "<b>" + solid + "</b>/" + total;
  refreshEl.querySelector(".refresh-sub").textContent = rusty
    ? rusty + (rusty === 1 ? " character wants" : " characters want") + " another look"
    : "all " + total + " are fresh — a round keeps them that way";
  refreshEl.querySelector(".refresh-bar > i").style.width = (100 * solid / total) + "%";
  refreshEl.setAttribute("aria-label",
    "Refresh, " + rusty + " of " + total + " characters need another look");
}
refreshEl.addEventListener("click", () => startSession(REVIEW));

function renderHome() {
  renderRefresh();
  groupListEl.innerHTML = "";
  GROUPS.forEach((g, gi) => {
    const st = groupState(gi);
    const learned = st.filter(c => c[0] >= LEARNED_AT).length;
    // green is still reserved for the whole group sitting at the top level
    const full = st.every(c => c[0] >= MAX_LEVEL - 1);
    const mark = g.cards[MARK_AT[gi]].k;
    const li = document.createElement("li");
    const btn = document.createElement("button");
    btn.className = "group-card" + (full ? " full" : "");
    btn.setAttribute("aria-label",
      DISPLAY[gi] + ", " + learned + " of " + g.cards.length + " learned");
    btn.innerHTML =
      '<span class="group-top"><span class="group-index mono">' + (gi + 1) + "</span>" +
      '<span class="group-count" aria-hidden="true"><b>' + learned + "</b>/" + g.cards.length +
      "</span></span>" +
      '<span class="group-mark kana-font' + (mark.length > 1 ? " two" : "") +
      '" aria-hidden="true">' + mark + "</span>" +
      '<span class="group-name">' + DISPLAY[gi] + "</span>" +
      '<span class="group-bar"><i style="width:' + (100 * learned / g.cards.length) + '%"></i></span>';
    btn.addEventListener("click", () => startSession(gi));
    li.appendChild(btn);
    groupListEl.appendChild(li);
  });
}

// that can be dismissed by reflex is a poor guard for that.

  resetConfirm.classList.toggle("hidden", which !== "confirm");

/* ---------- session state ---------- */
const stage = document.getElementById("stage");
let S = null; // active session

const REVIEW = -1;  // the mixed refresh deck, in place of a group index

// One group, in the same shape reviewDeck() produces, so everything downstream
// of here can stop caring which kind of session it is running.
function deckForGroup(gi) {
  const st = groupState(gi);
  const key = groupKey(gi);
  return GROUPS[gi].cards.map((c, ci) => ({ k: c.k, r: c.r, refs: [st[ci]], keys: [key] }));
}

function startSession(gi) {
  const review = gi === REVIEW;
  const deck = review ? reviewDeck() : deckForGroup(gi);
  if (!deck.length) return;
  S = {
    gi,
    deck,
    cards: deck.map(e => e.refs[0]),
    failKey: review ? script + ":review" : groupKey(gi),
    forced: -1,           // index to re-ask immediately after a miss; -1 = none
    lastKnown: false,     // true right after a filler question of a mastered card
    current: -1,
    failed: false,        // wrong answer given on the current display
    fails: store.fails[review ? script + ":review" : groupKey(gi)] || 0,
    sinceNew: NEW_COOLDOWN,  // questions since the last new character

    phase: "question",
    // a refresh has no finish line to celebrate: it runs until you leave
    celebrated: review || deck.every(e => e.refs[0][0] >= MAX_LEVEL - 1),
    shownAt: 0,
  };
  document.getElementById("sessionTitle").textContent = review ? "Refresh" : DISPLAY[gi];
  homeEl.classList.add("hidden");
  sessionEl.classList.remove("hidden");
  showQuestion();
}

function goHome() {
  S = null;
  sessionEl.classList.add("hidden");
  homeEl.classList.remove("hidden");
  renderHome();
}
document.getElementById("backBtn").addEventListener("click", goHome);

/* ---------- the algorithm ---------- */

// The gate on pass 2. A character only joins the deck once the ones already in
// it are holding up: none still shaky, not too many mid-flight, and a decent
// stretch of drilling since the last one arrived.
function readyForNew() {
  let inPlay = 0, solid = 0;
  for (let i = 0; i < S.cards.length; i++) {
    const c = S.cards[i];
    if (!c[2]) continue;                    // not introduced yet
    if (c[0] < NEW_AFTER_LEVEL) return false;
    if (c[0] < MAX_LEVEL - 1) inPlay++;     // learned, not yet solid
    else solid++;
  }
  if (inPlay >= WORKING_SET) return false;
  // the cooldown buys drilling time, so it only earns its keep when there is
  // something to drill: with nothing half-known and one lone mastered card to
  // fall back on it would just show that card over and over
  if (S.sinceNew < NEW_COOLDOWN && (inPlay > 0 || solid > 1)) return false;
  return true;
}

function selectQuestion() {
  const cards = S.cards;
  if (S.forced !== -1) return S.forced;

  // pass 1: weakest due card among those already introduced. A missed card sits
  // at level 0 with no wait left, so it lands here first. Ties go to whichever
  // card has been missed most often -- that is the one wanting the repetition.
  let best = -1, bestLevel = MAX_LEVEL - 1, bestMiss = -1;
  for (let i = 0; i < cards.length; i++) {
    const c = cards[i];
    if (!c[2] || c[1] !== 0 || c[0] >= MAX_LEVEL - 1) continue;
    if (c[0] < bestLevel || (c[0] === bestLevel && (c[4] || 0) > bestMiss)) {
      bestLevel = c[0]; bestMiss = c[4] || 0; best = i;
    }
  }
  if (best !== -1) { S.lastKnown = false; return best; }

  // pass 2: introduce the next new card — but only if the deck is ready for it
  let fresh = -1;
  for (let i = 0; i < cards.length; i++) {
    if (!cards[i][2]) { fresh = i; break; }
  }
  if (fresh !== -1 && readyForNew()) { S.lastKnown = false; return fresh; }

  // pass 3: nothing due — pull the soonest-due unmastered card forward. While
  // new characters are still queued this is the point of the exercise: drill
  // what is on the table instead of moving on. Once the group is fully
  // introduced it alternates with the filler below, so mastered characters
  // keep coming back too.
  // Misses count as time already served, so a character that keeps going wrong
  // jumps the queue ahead of one that is merely due at the same moment.
  if (fresh !== -1 || S.lastKnown) {
    best = -1;
    let bestNext = Infinity;
    for (let i = 0; i < cards.length; i++) {
      if (!cards[i][2] || cards[i][0] >= MAX_LEVEL - 1) continue;
      const due = cards[i][1] / leech(cards[i]);
      if (due < bestNext) { bestNext = due; best = i; }
    }
    if (best !== -1) { S.lastKnown = false; return best; }
  }

  // pass 4: filler — a mastered card, drawn with a weight rather than evenly,
  // so the ones that have gone wrong before come round more often than the ones
  // that never have. On a refresh this is most of the session.
  S.lastKnown = true;
  const mastered = [], weights = [];
  let total = 0;
  for (let i = 0; i < cards.length; i++) {
    if (cards[i][0] >= MAX_LEVEL - 1) {
      const w = leech(cards[i]);
      mastered.push(i);
      weights.push(w);
      total += w;
    }
  }
  if (mastered.length === 0) return fresh !== -1 ? fresh : 0;
  let roll = Math.random() * total;
  for (let n = 0; n < mastered.length; n++) {
    roll -= weights[n];
    if (roll <= 0) return mastered[n];
  }
  return mastered[mastered.length - 1];
}

function showQuestion() {
  const cards = S.cards;
  S.failed = false;
  const isForced = S.forced !== -1;
  S.current = selectQuestion();
  // every question shown ticks the whole deck down by one
  for (let i = 0; i < cards.length; i++) {
    if (cards[i][1] > 0) cards[i][1]--;
  }
  saveStore();
  renderHud();

  // a character never seen before is shown pre-marked among the four rather
  // than on a card of its own, so the rhythm of the drill never breaks
  const card = cards[S.current];
  const isNew = !isForced && !card[2];
  if (isNew) {
    card[2] = 1;
    S.sinceNew = 0;
    saveStore();
  } else {
    S.sinceNew++;
  }
  renderQuestion(isNew);
}

/* ---------- rendering ---------- */
function kanaOf(i) { return S.deck[i].k; }
function romajiOf(i) { return S.deck[i].r; }

// A character in several groups is answered once and recorded in all of them:
// leaving the other copies behind would have a refresh raise your reading of
// た while three group tiles went on claiming it was never learned.
function syncRefs(entry) {
  const src = entry.refs[0];
  for (let i = 1; i < entry.refs.length; i++) {
    const r = entry.refs[i];
    r[0] = src[0]; r[1] = src[1]; r[3] = src[3];
    r[4] = Math.max(r[4] || 0, src[4]);
  }
}

// ported from the original's ProgressView: `done` is accumulated levels over
// the maximum, `clean` the part of it that was not paid for with a miss
function pieSlices() {
  let sum = 0;
  for (let i = 0; i < S.cards.length; i++) sum += S.cards[i][0];
  const done = Math.round(sum * 100 / (S.cards.length * (MAX_LEVEL - 1)));
  let failPct = sum > 0 ? Math.round(S.fails * 100 / sum) : 0;
  if (failPct > 100) failPct = 100;
  // any miss at all stays visible instead of rounding away to nothing
  if (failPct > 0 && failPct < 5) failPct = 5;
  return { done: done, clean: Math.round((100 - failPct) * done / 100) };
}

function renderHud() {
  const pie = document.getElementById("pie");
  if (!pie) return;
  const p = pieSlices();
  pie.style.setProperty("--done", p.done + "%");
  pie.style.setProperty("--clean", p.clean + "%");
  pie.setAttribute("aria-label", p.done + " percent learned");
}

function renderQuestion(isNew) {
  S.phase = "question";
  const correct = S.current;

  // 3 distractors from the same deck. Two rules the single-group deck never
  // needed: nothing that answers the prompt just as well (a mixed refresh holds
  // both じ and ぢ, and away from their own groups both are "ji"), and a
  // preference for characters that share a group with the right one. Drawn flat
  // from a hundred kana the choices would be trivially far apart, which would
  // make a refresh easier than the drill it is refreshing.
  const pool = S.deck;
  const near = [], far = [];
  for (let i = 0; i < pool.length; i++) {
    if (i === correct || pool[i].r === pool[correct].r) continue;
    (pool[i].keys.some(k => pool[correct].keys.includes(k)) ? near : far).push(i);
  }
  const picks = [correct];
  for (const bag of [near, far]) {
    while (picks.length < 4 && bag.length) {
      picks.push(bag.splice(Math.floor(Math.random() * bag.length), 1)[0]);
    }
  }
  const pos = Math.floor(Math.random() * picks.length);
  [picks[0], picks[pos]] = [picks[pos], picks[0]];
  const p = pieSlices();

  stage.innerHTML =
    '<div class="prompt-zone">' +
      '<button class="prompt" id="prompt" aria-label="Play the sound again">' +
        '<span class="romaji-big">' + romajiOf(correct) + "</span>" +
        ("speechSynthesis" in window ? '<span class="prompt-hint">tap to repeat</span>' : "") +
      "</button>" +
    "</div>" +
    '<div class="answers">' +
    picks.map((i, n) =>
      '<button class="answer kana-font' + (kanaOf(i).length > 1 ? " two" : "") +
      (isNew && i === correct ? " new" : "") +
      '" data-i="' + i + '"><span class="key mono">' + (n + 1) + "</span>" + kanaOf(i) + "</button>"
    ).join("") +
    '<div class="pie" id="pie" role="img" style="--done:' + p.done + "%;--clean:" + p.clean +
    '%" aria-label="' + p.done + ' percent learned"></div>' +
    "</div>";
  stage.querySelectorAll(".answer").forEach(btn => {
    btn.addEventListener("click", () => answer(btn));
  });
  document.getElementById("prompt").addEventListener("click", () => speak(kanaOf(S.current)));
  S.shownAt = performance.now();
  speak(kanaOf(correct));
}

function answer(btn) {
  if (S.phase !== "question") return;
  // questions advance the instant one is answered, so swallow the tail of a
  // double tap instead of letting it answer the question that just appeared
  if (performance.now() - S.shownAt < 130) return;
  const entry = S.deck[S.current];
  const card = S.cards[S.current];
  const now = today();

  if (Number(btn.dataset.i) !== S.current) {
    // miss: the card drops to zero, but the screen stays put — the question is
    // not over until the right kana is picked. wrong choices just go red.
    S.failed = true;
    S.forced = S.current;
    card[0] = 0;
    card[1] = 0;
    card[3] = now;
    card[4] = (card[4] || 0) + 1;  // and from now on it comes back sooner
    S.fails++;
    store.fails[S.failKey] = S.fails;
    // a miss during a refresh still belongs to the groups the character lives
    // in, so their own tiles and pies stay honest about it
    if (S.gi === REVIEW) {
      for (const k of entry.keys) store.fails[k] = (store.fails[k] || 0) + 1;
    }
    syncRefs(entry);
    saveStore();
    btn.classList.add("wrong");
    btn.disabled = true;
    renderHud();
    return;
  }

  if (!S.failed) {
    S.forced = -1;
    if (card[0] < MAX_LEVEL - 1) {
      card[0]++;
      const base = NEXT_BY_LEVEL[card[0]];
      card[1] = base ? Math.max(1, Math.round(base / leech(card))) : 0;
      // reaching the top forgives half the misses: a rough start should not
      // mark a character for life once it is plainly known
      if (card[0] >= MAX_LEVEL - 1) card[4] = card[4] >> 1;
    }
  }
  card[3] = now;
  syncRefs(entry);
  saveStore();
  renderHud();
  // advance synchronously: the next question's audio has to be spoken inside
  // this click, or Chrome on Android drops it for want of a user gesture
  if (!S.celebrated && S.cards.every(c => c[0] >= MAX_LEVEL - 1)) {
    S.celebrated = true;
    renderMastered();
  } else {
    showQuestion();
  }
}

function renderMastered() {
  S.phase = "mastered";
  stage.innerHTML =
    '<div class="mastered">' +
      '<div class="kana-big kana-font">よくできました</div>' +
      "<h2>Group mastered</h2>" +
      "<p>All " + S.cards.length + " characters are at the top level.<br>Reviews keep them fresh.</p>" +
      '<div class="mastered-actions">' +
        '<button class="primary-btn" id="keepGoing">Keep reviewing</button>' +
        '<button class="ghost-btn" id="toHome">Back to lessons</button>' +
      "</div>" +
    "</div>";
  document.getElementById("keepGoing").addEventListener("click", showQuestion);
  document.getElementById("toHome").addEventListener("click", goHome);
}

/* ---------- keyboard ---------- */
document.addEventListener("keydown", e => {
  if (!S) return;
  if (e.key === "Escape") { goHome(); return; }
  if (S.phase === "question" && e.key >= "1" && e.key <= "4") {
    const btns = stage.querySelectorAll(".answer");
    const btn = btns[Number(e.key) - 1];
    if (btn && !btn.disabled) answer(btn);
  }
});

/* ---------- boot ---------- */
renderHome();
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(() => { /* offline still works next load */ });
}
</script>
</body>
</html>
